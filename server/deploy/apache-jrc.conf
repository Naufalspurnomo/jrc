# JRC XIV production virtual host template.
# Serve this host through HTTPS before enabling the gate camera.
<VirtualHost *:80>
    ServerName jrc.example.org
    Redirect permanent / https://jrc.example.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName jrc.example.org
    DocumentRoot /var/www/jrc

    # Exclude query strings so opaque QR credentials never enter access logs.
    LogFormat "%a %l %u %t \"%m %U %H\" %>s %b" jrc_no_query
    CustomLog ${APACHE_LOG_DIR}/jrc-access.log jrc_no_query

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/jrc.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jrc.example.org/privkey.pem

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3010/api retry=0 timeout=60
    ProxyPassReverse /api http://127.0.0.1:3010/api

    <Location /api>
        Header always set Cache-Control "private, no-store"
    </Location>

    <Directory /var/www/jrc>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api(?:/|$)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml

    ExpiresActive On
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType image/webp "access plus 1 year"
    ExpiresByType image/avif "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType video/webm "access plus 1 year"

    <FilesMatch "\.(?:css|js|webp|avif|woff2|webm)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "^(?:index\.html|robots\.txt)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
</VirtualHost>
